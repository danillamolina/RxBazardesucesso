<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2416" />
      <stop offset="50%" stop-color="#283520" />
      <stop offset="100%" stop-color="#3D4F31" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F7F4EB" />
      <stop offset="100%" stop-color="#D8C7AC" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9BA94" />
      <stop offset="50%" stop-color="#8FA079" />
      <stop offset="100%" stop-color="#6F805B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#sageGrad)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Central Badge Glow -->
  <circle cx="256" cy="240" r="168" fill="#8FA079" fill-opacity="0.12" />

  <!-- Monogram Rx -->
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Letter R -->
    <text x="135" y="295" font-size="210" font-weight="900" fill="url(#goldGrad)" letter-spacing="-6">R</text>
    
    <!-- Letter x in emerald/sage accent -->
    <text x="275" y="300" font-size="175" font-weight="900" fill="url(#sageGrad)" letter-spacing="-2">x</text>
  </g>

  <!-- Top Sparkle Icon -->
  <path d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120 Z" fill="#EAD9BD" />
  <circle cx="395" cy="180" r="6" fill="#8FA079" />

  <!-- Subtitle Pill BAZAR -->
  <g filter="url(#shadow)">
    <rect x="146" y="360" width="220" height="44" rx="22" fill="#8FA079" fill-opacity="0.25" stroke="url(#sageGrad)" stroke-width="2.5" />
    <text x="256" y="389" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#F7F4EB" text-anchor="middle" letter-spacing="6">BAZAR</text>
  </g>
</svg>
